services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
  ledgerd:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ledger?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
